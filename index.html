<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Registry</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #eef2f3; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
        }

        h2 { 
            color: #2c3e50; 
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
        }

        p {
            color: #7f8c8d;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #3498db;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>User Registry</h2>
        <p>Please enter your details below to subscribe.</p>
        
        <!-- ATTENTION: Replace the URL inside action="" with your real Formspree link! -->
        <form action="https://formspree.io" method="POST">
            
            <div class="input-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" name="name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="useremail">Email Address</label>
                <input type="email" id="useremail" name="email" placeholder="john@example.com" required>
            </div>

            <button type="submit" class="submit-btn">Submit Details</button>
            
        </form>
    </div>

</body>
</html>
